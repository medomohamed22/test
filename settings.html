<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f3bd4"><link rel="manifest" href="/manifest.webmanifest"><title>الإعدادات — DealWay</title><link rel="stylesheet" href="/pages.css"></head><body><header class="top"><div class="shell topin"><button class="back" onclick="goBackSafe()">‹</button><strong data-i18n="settings">الإعدادات</strong><span class="brand">DealWay π</span></div></header><main class="shell"><h1>تخصيص DealWay</h1><div class="settings-list"><section class="card"><h2>اللغة</h2><div class="segmented"><button onclick="DW.setLocale('ar');location.reload()">العربية</button><button onclick="DW.setLocale('en');location.reload()">English</button></div></section><section class="card"><h2>طريقة عرض السعر</h2><div class="segmented"><button onclick="DW.setCurrency('USD')">USD $</button><button onclick="DW.setCurrency('PI')">Pi π</button></div><p class="muted">سعر Pi نفسه يظل محسوبًا من السعر الحالي المستخدم في DealWay.</p></section><section class="card"><h2>الإشعارات</h2><p class="muted">فعّل إشعارات الرسائل والعروض ونتائج البحث الجديدة حتى عند خروجك من الصفحة.</p><button class="btn primary" onclick="enablePush()">تفعيل الإشعارات</button></section><section class="card"><h2>تثبيت التطبيق</h2><p class="muted">ثبّت DealWay على الشاشة الرئيسية لتجربة أسرع وشبيهة بالتطبيق.</p><button class="btn outline" data-install-app onclick="installDealWay()">تثبيت DealWay</button></section></div></main><div class="toast" id="toast"></div><script src="/common.js"></script><script>function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}async function enablePush(){try{await enableDealWayPush();toast('تم تفعيل الإشعارات بنجاح')}catch(e){toast(e.message)}}</script></body></html>
