<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f3bd4"><link rel="manifest" href="/manifest.webmanifest"><title>الإعدادات — DealWay</title><link rel="stylesheet" href="/pages.css"></head><body><header class="top"><div class="shell topin"><button class="back" onclick="goBackSafe()">‹</button><strong data-i18n="settings">الإعدادات</strong><span class="brand">DealWay π</span></div></header><main class="shell"><h1>تخصيص DealWay</h1><div class="settings-list"><section class="card"><h2>اللغة</h2><div class="segmented"><button onclick="DW.setLocale('ar');location.reload()">العربية</button><button onclick="DW.setLocale('en');location.reload()">English</button></div></section><section class="card"><h2>طريقة عرض السعر</h2><div class="segmented"><button onclick="DW.setCurrency('USD')">USD $</button><button onclick="DW.setCurrency('PI')">Pi π</button></div><p class="muted">سعر Pi نفسه يظل محسوبًا من السعر الحالي المستخدم في DealWay.</p></section><section class="card"><h2>الإشعارات</h2><p class="muted">فعّل إشعارات الرسائل والعروض ونتائج البحث الجديدة حتى عند خروجك من الصفحة.</p><div class="inline-actions"><button class="btn primary" onclick="enablePush()">تفعيل إشعارات الجهاز</button><button class="btn outline" onclick="testPiNotification(this)">اختبار إشعار Pi</button></div><p class="muted" id="piNotifyStatus"></p></section><section class="card"><h2>تثبيت التطبيق</h2><p class="muted">ثبّت DealWay على الشاشة الرئيسية لتجربة أسرع وشبيهة بالتطبيق.</p><button class="btn outline" data-install-app onclick="installDealWay()">تثبيت DealWay</button></section></div></main><div class="toast" id="toast"></div><script src="/common.js"></script><script>function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}async function enablePush(){try{await enableDealWayPush();toast('تم تفعيل الإشعارات بنجاح')}catch(e){toast(e.message)}}async function testPiNotification(btn){const token=localStorage.getItem('dw_token');if(!token)return toast('سجّل الدخول بحساب Pi أولاً');const old=btn.textContent;btn.disabled=true;btn.textContent='جاري الاختبار...';try{const r=await fetch('/api/notifications/pi-test',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});const j=await r.json();if(!r.ok){console.error('Pi notification test',j);const extra=j.pi_status?' (Pi HTTP '+j.pi_status+')':'';throw new Error((j.error||'فشل إشعار Pi')+extra)}document.querySelector('#piNotifyStatus').textContent='تم قبول الإشعار من Pi Platform. راقب مركز إشعارات Pi Browser.';toast('تم إرسال إشعار اختبار إلى Pi')}catch(e){document.querySelector('#piNotifyStatus').textContent='فشل اختبار Pi: '+e.message;toast(e.message)}finally{btn.disabled=false;btn.textContent=old}}</script></body></html>
