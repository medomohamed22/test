<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealWay Admin</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>
:root{--p:#6d4aff;--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#64748b;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:var(--bg);color:var(--text)}.top{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:16px}.wrap{max-width:1200px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.login{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(135deg,#8b5cf6,#f59e0b);color:#fff;font-weight:900}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:18px 0}.stat,.panel,.ad{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px #1118270b}.stat{padding:16px}.stat b{font-size:26px;display:block}.stat span{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:999px;font-weight:800}.tab.active{background:var(--p);color:#fff}.panel{padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.ad{overflow:hidden}.imgs{display:flex;overflow:auto;scroll-snap-type:x mandatory;background:#eef2ff}.imgs img{width:100%;height:230px;object-fit:cover;flex:0 0 100%;scroll-snap-align:start}.body{padding:16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--muted);margin:12px 0}.desc{white-space:pre-wrap;line-height:1.8}.price{font-size:22px;font-weight:900;color:var(--p)}.actions{display:flex;gap:10px}.actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900}.approve{background:#10b981;color:#fff}.reject{background:#ef4444;color:#fff}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.scroll{overflow:auto}.empty{text-align:center;padding:40px;color:var(--muted)}dialog{border:0;border-radius:20px;padding:22px;max-width:430px;width:calc(100% - 32px)}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.muted{color:var(--muted)}
</style></head><body><header class="top"><div class="wrap head"><div><b>لوحة إدارة DealWay</b><div style="font-size:12px;color:#cbd5e1">المراجعة والإحصائيات والمدفوعات</div></div><button class="login" id="loginBtn">دخول الأدمن عبر Pi</button></div></header><main class="wrap"><section id="stats" class="stats"></section><div class="tabs"><button class="tab active" data-tab="review">الإعلانات للمراجعة</button><button class="tab" data-tab="payments">دفعات التمييز</button><button class="tab" data-tab="users">المستخدمون</button></div><section id="review" class="panel"><div id="ads" class="grid"><div class="empty">سجّل الدخول لعرض البيانات</div></div></section><section id="payments" class="panel" hidden><div class="scroll"><table class="table"><thead><tr><th>المستخدم</th><th>الإعلان</th><th>الباقة</th><th>USD</th><th>Pi</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="paymentsBody"></tbody></table></div></section><section id="users" class="panel" hidden><div class="scroll"><table class="table"><thead><tr><th>المستخدم</th><th>Pi UID</th><th>الدور</th><th>تيليجرام</th><th>محظور</th><th>تاريخ التسجيل</th></tr></thead><tbody id="usersBody"></tbody></table></div></section></main><dialog id="rejectDialog"><h3>سبب رفض الإعلان</h3><p class="muted">سيظهر السبب للمستخدم، وسيتم حذف الصور فقط مع الاحتفاظ بسجل الإعلان.</p><textarea id="reason" minlength="3" maxlength="500" placeholder="اكتب سببًا واضحًا..."></textarea><div class="actions"><button class="reject" id="confirmReject">تأكيد الرفض</button><button onclick="rejectDialog.close()">إلغاء</button></div></dialog><script>
'use strict';let token='',payload=null,rejectId=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Pi.init({version:'2.0',sandbox:false});
$('loginBtn').onclick=async()=>{try{const a=await Pi.authenticate(['username'],()=>{});token=a.accessToken;await load()}catch(e){alert(e.message||'فشل تسجيل الدخول')}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['review','payments','users'].forEach(x=>$(x).hidden=x!==b.dataset.tab)});
async function request(method='GET',body){const r=await fetch('/api/admin-products',{method,credentials:'omit',cache:'no-store',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){payload=await request();renderStats();renderAds();renderPayments();renderUsers()}
function renderStats(){const s=payload.stats||{},items=[['المستخدمون',s.users],['كل الإعلانات',s.products],['قيد المراجعة',s.pending],['مقبولة',s.approved],['مرفوضة',s.rejected],['مميزة الآن',s.promoted],['دفعات مكتملة',s.completedPayments],['إيراد التمييز $',Number(s.promotionRevenueUsd||0).toFixed(2)],['إيراد Pi',Number(s.promotionRevenuePi||0).toFixed(4)],['المشاهدات',s.totalViews]];$('stats').innerHTML=items.map(x=>`<div class="stat"><b>${esc(x[1]??0)}</b><span>${esc(x[0])}</span></div>`).join('')}
function renderAds(){const a=payload.pending||[];$('ads').innerHTML=a.map(p=>`<article class="ad"><div class="imgs">${(p.images||[]).map(x=>`<img src="${esc(x)}" loading="lazy">`).join('')}</div><div class="body"><h2>${esc(p.name)}</h2><div class="price">$${Number(p.price_usd).toFixed(2)}</div><p class="desc">${esc(p.description)}</p><div class="meta"><span>البائع: ${esc(p.seller_username)}</span><span>القسم: ${esc(p.category)}</span><span>الدولة: ${esc(p.country)}</span><span>المنطقة: ${esc(p.location)}</span><span>الصور: ${(p.images||[]).length}</span><span>التاريخ: ${new Date(p.created_at).toLocaleString('ar')}</span></div><div class="actions"><button class="approve" onclick="review(${p.id},'approve')">موافقة</button><button class="reject" onclick="openReject(${p.id})">رفض</button></div></div></article>`).join('')||'<div class="empty">لا توجد إعلانات معلقة</div>'}
function renderPayments(){$('paymentsBody').innerHTML=(payload.payments||[]).map(x=>`<tr><td>${esc(x.user_id)}</td><td>${esc(x.product_id)}</td><td>${esc(x.tier)}</td><td>$${Number(x.amount_usd||0).toFixed(2)}</td><td>${Number(x.amount_pi||0).toFixed(6)}</td><td>${esc(x.status)}</td><td>${new Date(x.completed_at||x.created_at).toLocaleString('ar')}</td></tr>`).join('')}
function renderUsers(){$('usersBody').innerHTML=(payload.users||[]).map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.pi_uid)}</td><td>${esc(x.role)}</td><td>${x.telegram_chat_id?'مرتبط':'غير مرتبط'}</td><td>${x.is_banned?'نعم':'لا'}</td><td>${new Date(x.created_at).toLocaleString('ar')}</td></tr>`).join('')}
async function review(id,action,reason){await request('POST',{id,action,reason});await load()}function openReject(id){rejectId=id;$('reason').value='';$('rejectDialog').showModal()}$('confirmReject').onclick=async()=>{const reason=$('reason').value.trim();if(reason.length<3)return alert('اكتب سببًا واضحًا');await review(rejectId,'reject',reason);$('rejectDialog').close()};
</script></body></html>
