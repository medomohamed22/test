<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DealWay Admin</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>
:root{--p:#5b55f7;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b768a;--line:#e3e8f1;--danger:#ef3340;--ok:#12a66a;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}.top{position:sticky;top:0;z-index:20;background:#121827;color:#fff;padding:12px 0;box-shadow:0 6px 20px #11182722}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand b{font-size:18px}.brand small{display:block;color:#b9c3d6;margin-top:3px}.btn{border:0;border-radius:11px;padding:9px 12px;font:inherit;font-weight:800;cursor:pointer}.login,.primary{background:var(--p);color:#fff}.danger{background:#fff0f1;color:#c81e2b}.success{background:#eafaf3;color:#087a4c}.ghost{background:#eef1f7;color:#3e4a60}.warn{background:#fff7e5;color:#9a5b00}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:#536078}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:8px 0 24px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;min-width:150px;flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.ad{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.ad img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#eef1f6}.body{padding:12px}.body h3{font-size:16px;margin:0 0 6px}.price{font-weight:900;color:#8a5700}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:12px;color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef1f7;font-size:11px;font-weight:900}.actions{display:flex;gap:6px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.table th{color:#536078;background:#f8f9fc;position:sticky;top:0}.user-main{font-weight:900}.verified{color:#087a4c;font-weight:900}.empty{text-align:center;padding:35px;color:var(--muted)}.notice{margin-top:14px;padding:12px;border-radius:12px;background:#eef2ff;color:#3730a3}.notice.error{background:#fff0f1;color:#b91c1c}dialog{border:0;border-radius:18px;padding:20px;width:min(420px,calc(100% - 28px));box-shadow:0 30px 80px #11182744}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h2{font-size:17px;margin:0}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{width:min(100% - 14px,1180px)}.brand small{display:none}.btn{padding:8px 9px;font-size:12px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:11px}.stat strong{font-size:18px}.grid{grid-template-columns:1fr}.panel{padding:10px;border-radius:14px}.meta{grid-template-columns:1fr 1fr}.toolbar input,.toolbar select{min-width:0;width:100%}}
</style></head><body><header class="top"><div class="wrap head"><div class="brand"><b>لوحة إدارة DealWay</b><small>المستخدمون، الإعلانات، المدفوعات، ومراقبة الموقع</small></div><button class="btn login" id="loginBtn">دخول الأدمن عبر Pi</button></div></header><main class="wrap"><div id="notice" style="display:none"></div><section id="stats" class="stats"></section><div class="tabs"><button class="tab active" data-tab="products">كل الإعلانات</button><button class="tab" data-tab="users">المستخدمون</button><button class="tab" data-tab="payments">المدفوعات</button><button class="tab" data-tab="site">الموقع</button></div>
<section id="products" class="panel"><div class="section-title"><h2>إدارة الإعلانات</h2><span id="productCount" class="pill"></span></div><div class="toolbar"><input id="productSearch" placeholder="بحث بالاسم أو البائع"><select id="productStatus"><option value="all">كل الحالات</option><option value="pending">قيد المراجعة</option><option value="approved">ظاهر</option><option value="hidden">مخفي</option><option value="rejected">مرفوض</option></select></div><div id="ads" class="grid"><div class="empty">سجّل الدخول لعرض البيانات</div></div></section>
<section id="users" class="panel" hidden><div class="section-title"><h2>إدارة المستخدمين</h2><span id="userCount" class="pill"></span></div><div class="toolbar"><input id="userSearch" placeholder="بحث بالاسم أو Pi UID أو الهاتف"><select id="userStatus"><option value="all">كل المستخدمين</option><option value="verified">موثّقون</option><option value="unverified">غير موثّقين</option><option value="banned">محظورون</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>الحالة</th><th>تيليجرام</th><th>الهاتف</th><th>تاريخ التسجيل</th><th>التحكم</th></tr></thead><tbody id="usersBody"></tbody></table></div></section>
<section id="payments" class="panel" hidden><div class="section-title"><h2>مدفوعات التمييز</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>الإعلان</th><th>الباقة</th><th>USD</th><th>Pi</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="paymentsBody"></tbody></table></div></section>
<section id="site" class="panel" hidden><div class="section-title"><h2>معلومات الموقع</h2></div><div id="siteInfo" class="meta"></div></section></main>
<dialog id="rejectDialog"><h3>سبب رفض الإعلان</h3><textarea id="reason" maxlength="500" placeholder="اكتب سببًا واضحًا"></textarea><div class="actions" style="margin-top:12px"><button class="btn danger" id="confirmReject">تأكيد الرفض</button><button class="btn ghost" onclick="rejectDialog.close()">إلغاء</button></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let token='',payload={},rejectId=null;const KEY='dealway_admin_auth';
function notice(msg,type=''){const n=$('notice');n.style.display='block';n.className='notice '+type;n.innerHTML=msg}function authHeaders(){return{'Content-Type':'application/json',Authorization:`Bearer ${token}`}}async function request(method='GET',body){const r=await fetch('/api/admin-products',{method,headers:authHeaders(),body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'فشل الطلب');return d}
async function login(){try{Pi.init({version:'2.0',sandbox:false});const a=await Pi.authenticate(['username'],()=>{});token=a.accessToken;localStorage.setItem(KEY,JSON.stringify({token,expiresAt:Date.now()+45*60*1000}));await load()}catch(e){notice(esc(e.message),'error')}}
async function load(){payload=await request();$('loginBtn').textContent=`الأدمن: ${payload.admin?.username||''}`;renderAll();if(payload.warnings?.length)notice(payload.warnings.map(esc).join('<br>'),'error');else notice(`تم تحديث البيانات: ${new Date(payload.generatedAt).toLocaleString('ar')}`)}
function renderAll(){renderStats();renderProducts();renderUsers();renderPayments();renderSite()}
function renderStats(){const s=payload.stats||{},items=[['المستخدمون',s.users],['الإعلانات',s.products],['قيد المراجعة',s.pending],['الظاهرة',s.approved],['المخفية',(payload.products||[]).filter(x=>x.status==='hidden').length],['المميزة',s.promoted],['المشاهدات',s.totalViews],['إيراد Pi',Number(s.promotionRevenuePi||0).toFixed(3)]];$('stats').innerHTML=items.map(x=>`<div class="stat"><strong>${esc(x[1]??0)}</strong><span>${esc(x[0])}</span></div>`).join('')}
function renderProducts(){const q=$('productSearch').value.toLowerCase(),st=$('productStatus').value;const rows=(payload.products||[]).filter(p=>(st==='all'||p.status===st)&&`${p.name} ${p.seller_username} ${p.country} ${p.location}`.toLowerCase().includes(q));$('productCount').textContent=`${rows.length} إعلان`;$('ads').innerHTML=rows.map(p=>{const img=p.images?.[0]||'';const promoted=p.promoted_until&&new Date(p.promoted_until)>new Date();return `<article class="ad">${img?`<img src="${esc(img)}" loading="lazy">`:''}<div class="body"><div><span class="pill">${esc(p.status)}</span>${promoted?' <span class="pill" style="background:#fff5d7;color:#9a5b00">مميز</span>':''}</div><h3>${esc(p.name)}</h3><div class="price">$${Number(p.price_usd||0).toFixed(2)}</div><div class="meta"><span>البائع: ${esc(p.seller_username)}</span><span>القسم: ${esc(p.category)}</span><span>الموقع: ${esc(p.country)} - ${esc(p.location)}</span><span>المشاهدات: ${Number(p.views||0)}</span><span>الصور: ${(p.images||[]).length}</span><span>${new Date(p.created_at).toLocaleString('ar')}</span></div><div class="actions">${p.status==='pending'?`<button class="btn success" onclick="actProduct(${p.id},'approve')">موافقة</button><button class="btn danger" onclick="openReject(${p.id})">رفض</button>`:''}${p.status==='approved'?`<button class="btn warn" onclick="actProduct(${p.id},'hide_product')">إخفاء</button>`:''}${p.status==='hidden'?`<button class="btn success" onclick="actProduct(${p.id},'unhide_product')">إظهار</button>`:''}<button class="btn danger" onclick="actProduct(${p.id},'delete_product',true)">حذف نهائي</button></div></div></article>`}).join('')||'<div class="empty">لا توجد نتائج</div>'}
function renderUsers(){const q=$('userSearch').value.toLowerCase(),st=$('userStatus').value;const rows=(payload.users||[]).filter(u=>{const verified=u.verification_status==='verified';const ok=st==='all'||(st==='verified'&&verified)||(st==='unverified'&&!verified)||(st==='banned'&&u.is_banned);return ok&&`${u.username} ${u.pi_uid} ${u.verification_phone||''}`.toLowerCase().includes(q)});$('userCount').textContent=`${rows.length} مستخدم`;$('usersBody').innerHTML=rows.map(u=>{const admin=u.role==='admin',verified=u.verification_status==='verified';return `<tr><td><div class="user-main">${esc(u.username)}</div><small>${esc(u.pi_uid)}</small></td><td>${verified?'<span class="verified">✓ موثّق</span>':'غير موثّق'} ${u.is_banned?'<span class="pill">محظور</span>':''}</td><td>${u.telegram_chat_id?`مرتبط ${u.telegram_username?'@'+esc(u.telegram_username):''}`:'غير مرتبط'}</td><td>${esc(u.verification_phone||'-')}</td><td>${new Date(u.created_at).toLocaleString('ar')}</td><td><div class="actions">${admin?'<span class="pill">أدمن</span>':`<button class="btn ${verified?'danger':'success'}" onclick="actUser('${esc(u.pi_uid)}','${verified?'unverify_user':'verify_user'}')">${verified?'إلغاء التوثيق':'توثيق'}</button><button class="btn ${u.is_banned?'success':'danger'}" onclick="actUser('${esc(u.pi_uid)}','${u.is_banned?'unban_user':'ban_user'}')">${u.is_banned?'فك الحظر':'حظر'}</button>`}</div></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">لا توجد نتائج</td></tr>'}
function renderPayments(){$('paymentsBody').innerHTML=(payload.payments||[]).map(x=>`<tr><td>${esc(x.username||x.user_id)}</td><td>${esc(x.product_name||x.product_id)}</td><td>${esc(x.tier)}</td><td>$${Number(x.amount_usd||0).toFixed(2)}</td><td>${Number(x.amount_pi||0).toFixed(5)}</td><td>${esc(x.status)}</td><td>${new Date(x.completed_at||x.created_at).toLocaleString('ar')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد مدفوعات</td></tr>'}
function renderSite(){const s=payload.stats||{};$('siteInfo').innerHTML=`<span>آخر تحديث: ${new Date(payload.generatedAt).toLocaleString('ar')}</span><span>إجمالي المشاهدات: ${s.totalViews||0}</span><span>الإعلانات المميزة: ${s.promoted||0}</span><span>الدفعات المكتملة: ${s.completedPayments||0}</span><span>إيراد USD: $${Number(s.promotionRevenueUsd||0).toFixed(2)}</span><span>إيراد Pi: ${Number(s.promotionRevenuePi||0).toFixed(4)}</span>`}
async function actProduct(id,action,confirmDelete=false){if(confirmDelete&&!confirm('سيتم حذف الإعلان وصوره نهائيًا. هل أنت متأكد؟'))return;try{notice('جارٍ تنفيذ العملية...');await request('POST',{id,action});await load()}catch(e){notice(esc(e.message),'error')}}function openReject(id){rejectId=id;$('reason').value='';$('rejectDialog').showModal()}$('confirmReject').onclick=async()=>{const reason=$('reason').value.trim();if(reason.length<3)return;await request('POST',{id:rejectId,action:'reject',reason});$('rejectDialog').close();await load()};async function actUser(piUid,action){if(!confirm('هل تريد تنفيذ هذا الإجراء؟'))return;try{await request('POST',{piUid,action});await load()}catch(e){notice(esc(e.message),'error')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['products','users','payments','site'].forEach(id=>$(id).hidden=id!==b.dataset.tab)});['productSearch','productStatus'].forEach(id=>$(id).addEventListener('input',renderProducts));['userSearch','userStatus'].forEach(id=>$(id).addEventListener('input',renderUsers));$('loginBtn').onclick=login;addEventListener('DOMContentLoaded',async()=>{try{const c=JSON.parse(localStorage.getItem(KEY)||'null');if(c?.token&&c.expiresAt>Date.now()){token=c.token;await load()}}catch{localStorage.removeItem(KEY)}})
</script></body></html>
