<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal Way Admin</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>body{font-family:Arial;background:#f8fafc;margin:0;padding:24px;color:#0f172a}.wrap{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #0001}.imgs{display:flex;gap:8px;overflow:auto}.imgs img{width:150px;height:150px;object-fit:cover;border-radius:14px}.actions{display:flex;gap:10px;margin-top:12px}button{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer}.approve{background:#10b981;color:#fff}.reject{background:#ef4444;color:#fff}.login{background:#6366f1;color:#fff}.price{font-weight:900;color:#7c3aed}</style></head><body><main class="wrap"><h1>مراجعة الإعلانات / Ad Review</h1><button class="login" onclick="login()">دخول الأدمن بـ Pi</button><div id="list"></div></main><script>
Pi.init({version:'2.0',sandbox:false});let token='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){const a=await Pi.authenticate(['username'],()=>{});token=a.accessToken;load();}
async function load(){const r=await fetch('/api/admin-products',{headers:{Authorization:`Bearer ${token}`}}),j=await r.json();if(!r.ok)return alert(j.error);document.getElementById('list').innerHTML=j.products.map(p=>`<article class="card"><div class="imgs">${p.images.map(x=>`<img src="${esc(x)}">`).join('')}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="price">$${Number(p.price_usd).toFixed(2)}</div><small>${esc(p.seller_username)} • ${esc(p.country)} / ${esc(p.location)}</small><div class="actions"><button class="approve" onclick="review(${p.id},'approve')">موافقة / Approve</button><button class="reject" onclick="review(${p.id},'reject')">رفض / Reject</button></div></article>`).join('')||'<p>لا توجد إعلانات معلقة.</p>';}
async function review(id,action){let reason='';if(action==='reject')reason=prompt('سبب الرفض / Rejection reason')||'غير مناسب';const r=await fetch('/api/admin-products',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({id,action,reason})}),j=await r.json();if(!r.ok)return alert(j.error);load();}
</script></body></html>
