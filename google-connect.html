<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChatWay — Google Drive</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f7f4ff;color:#20162f;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(94vw,420px);background:#fff;border:1px solid #e8e1f3;border-radius:26px;padding:28px 22px;text-align:center;box-shadow:0 18px 60px #3d1c7014}
.logo{width:72px;height:72px;border-radius:22px;background:#efe8ff;color:#6f3cff;display:grid;place-items:center;margin:auto;font-size:34px;font-weight:900}
h1{font-size:21px;margin:18px 0 8px}p{font-size:14px;line-height:1.8;color:#756d80;margin:0}
.spinner{width:38px;height:38px;border:4px solid #ece5fa;border-top-color:#6f3cff;border-radius:50%;animation:s .75s linear infinite;margin:22px auto}@keyframes s{to{transform:rotate(360deg)}}
.ok{font-size:44px;margin:18px 0 8px}.err{color:#c93452}
button{border:0;border-radius:16px;background:#6f3cff;color:#fff;font-weight:800;padding:13px 18px;margin-top:18px;width:100%;font-size:15px}
small{display:block;margin-top:14px;color:#9b93a4;line-height:1.6}
</style>
</head>
<body>
<div class="card">
 <div class="logo">G</div>
 <div id="loading">
  <h1>ربط Google Drive</h1>
  <p id="status">جاري تجهيز تسجيل الدخول إلى Google…</p>
  <div class="spinner"></div>
 </div>
 <div id="success" hidden>
  <div class="ok">✅</div>
  <h1>تم ربط Google Drive</h1>
  <p>ارجع الآن إلى Pi Browser وافتح إعدادات ChatWay. سيتم اكتشاف الربط تلقائيًا.</p>
  <button id="closeBtn">تم</button>
 </div>
 <div id="error" hidden>
  <div class="ok">⚠️</div>
  <h1>تعذر ربط Google</h1>
  <p class="err" id="errorText"></p>
  <button id="retryBtn">إعادة المحاولة</button>
 </div>
 <small>ChatWay يستخدم صلاحية Google Drive محدودة لملفات النسخ الاحتياطي التي ينشئها التطبيق.</small>
</div>
<script>
const $=s=>document.querySelector(s);
function show(which,msg=''){
  $('#loading').hidden=which!=='loading';$('#success').hidden=which!=='success';$('#error').hidden=which!=='error';
  if(msg)$('#errorText').textContent=msg;
}
function tokenFromHash(){
  const raw=location.hash.startsWith('#')?location.hash.slice(1):location.hash;
  return new URLSearchParams(raw).get('token')||sessionStorage.getItem('cw_pi_token')||'';
}
async function start(){
  const qs=new URLSearchParams(location.search);
  if(qs.get('connected')==='1'){show('success');history.replaceState({},'',location.pathname+'?connected=1');return}
  const token=tokenFromHash();
  if(token)sessionStorage.setItem('cw_pi_token',token);
  history.replaceState({},'',location.pathname);
  if(!token){show('error','جلسة Pi غير موجودة. ارجع إلى ChatWay وسجل الدخول بحساب Pi ثم حاول مرة أخرى.');return}
  show('loading');
  try{
    const ctrl=new AbortController();const tm=setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch('/api/google',{
      method:'POST',
      headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({action:'auth_url'}),
      cache:'no-store',
      signal:ctrl.signal
    });
    clearTimeout(tm);
    const txt=await r.text();let d={};try{d=JSON.parse(txt)}catch{}
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    if(!d.url)throw new Error('لم يتم إنشاء رابط Google');
    location.replace(d.url);
  }catch(e){
    let m=e.name==='AbortError'?'انتهت مهلة الاتصال بالخادم. تأكد من إعدادات Vercel ثم حاول مرة أخرى.':String(e.message||e);
    if(m==='google_oauth_not_configured')m='إعدادات Google OAuth غير مكتملة على Vercel.';
    if(/token|signature|claims|expired/i.test(m))m='انتهت جلسة Pi. ارجع إلى ChatWay وسجل الدخول مرة أخرى.';
    show('error',m);
  }
}
$('#retryBtn').onclick=start;
$('#closeBtn').onclick=()=>{try{window.close()}catch{}};
start();
</script>
</body>
</html>
