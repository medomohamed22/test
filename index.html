<body>
<header class="topbar"><div class="shell nav">
  <a class="brand" href="#" onclick="goHome()"><div class="brandmark">π</div><span>DealWay</span></a>
  <div class="searchbar" id="searchbar"><input id="q" aria-label="البحث" placeholder="ابحث عن موبايل، سيارة، خدمة..." onkeydown="if(event.key==='Enter')loadListings()"><button class="search-submit" onclick="loadListings()">بحث</button></div>
  <div class="nav-actions">
    <button class="iconbtn" aria-label="فتح البحث" onclick="toggleSearch()" data-icon="search"></button>
    <button class="iconbtn hide-mobile" aria-label="المفضلة" onclick="openFavorites()" data-icon="heart"></button>
    <button class="iconbtn hide-mobile" aria-label="الرسائل" onclick="openChats()" data-icon="message"></button>
    <button class="btn primary" onclick="requireLogin(()=>openSell())" data-leading-icon="plus">بيع</button>
    <button class="btn outline pi-login" id="loginBtn" onclick="loginPi()" data-leading-icon="user">دخول Pi</button>
  </div>
</div></header>

<main class="shell" id="main">
  <section class="hero">
    <div class="hero-copy"><span class="eyebrow" data-leading-icon="spark">Marketplace لمجتمع Pi Network</span><h1>بيع واشتري بـ Pi<br>بسهولة وثقة</h1><p>سوق عربي بسيط لمجتمع Pi: اكتشف الإعلانات، تواصل مع البائعين، قدم عروضك، وروّج إعلانك بخطوات واضحة.</p><div class="hero-actions"><button class="btn primary" onclick="document.getElementById('market').scrollIntoView()" data-leading-icon="grid">استكشف السوق</button><button class="btn outline" onclick="requireLogin(()=>openSell())" data-leading-icon="plus">انشر إعلان مجانًا</button></div><div class="trustbar"><span class="pill" data-leading-icon="shield">تسجيل Pi آمن</span><span class="pill" data-leading-icon="star">تقييمات موثوقة</span><span class="pill" data-leading-icon="tag">نشر أساسي مجاني</span></div></div>
    <div class="hero-visual" aria-hidden="true"><div class="hero-card"><div class="pi-orbit"><span class="pi-glyph">π</span></div></div></div>
  </section>

  <section class="section"><div class="section-head"><div><h2>التصنيفات</h2><div class="sub">ابدأ من القسم المناسب</div></div></div><div class="cats" id="categories"></div></section>
  <section class="section" id="market"><div class="section-head"><div><h2>أحدث الإعلانات</h2><div class="sub" id="resultText">تحميل السوق...</div></div><button class="btn outline" onclick="resetFilters()">مسح الفلاتر</button></div>
    <div class="filters"><select id="categoryFilter" onchange="loadListings()"><option value="">كل الأقسام</option></select><select id="conditionFilter" onchange="loadListings()"><option value="">كل الحالات</option><option value="new">جديد</option><option value="like_new">كالجديد</option><option value="used">مستعمل</option></select><input class="field" id="cityFilter" placeholder="المدينة" onkeydown="if(event.key==='Enter')loadListings()"><input class="field" id="minFilter" type="number" placeholder="أقل سعر Pi" onchange="loadListings()"><input class="field" id="maxFilter" type="number" placeholder="أعلى سعر Pi" onchange="loadListings()"><select id="sortFilter" onchange="loadListings()"><option value="newest">الأحدث</option><option value="price_asc">السعر: الأقل</option><option value="price_desc">السعر: الأعلى</option><option value="views">الأكثر مشاهدة</option></select></div>
    <div class="grid" id="listingGrid"><div class="spinner"></div></div>
  </section>
</main>

<nav class="bottomnav" aria-label="التنقل الرئيسي"><button onclick="goHome()"><b data-icon="home"></b>الرئيسية</button><button onclick="toggleSearch()"><b data-icon="search"></b>بحث</button><button class="sellmini" onclick="requireLogin(()=>openSell())"><b data-icon="plus"></b>بيع</button><button onclick="openChats()"><b data-icon="message"></b>الرسائل</button><button onclick="openProfile()"><b data-icon="user"></b>حسابي</button></nav>

const API=''; let token=localStorage.getItem('dw_token')||''; let me=JSON.parse(localStorage.getItem('dw_user')||'null'); let cats=[]; let listings=[]; let socket=null; let piReady=false; let piConfig=null; let pendingIncompletePayment=null;
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const ICONS={search:'<path d="m21 21-4.35-4.35"/><circle cx="11" cy="11" r="7"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',message:'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>',plus:'<path d="M12 5v14M5 12h14"/>',user:'<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',spark:'<path d="m12 3 1.7 4.3L18 9l-4.3 1.7L12 15l-1.7-4.3L6 9l4.3-1.7Z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',star:'<path d="m12 2 3 6 6.5.9-4.7 4.6 1.1 6.5-5.9-3.1L6.1 20l1.1-6.5L2.5 8.9 9 8z"/>',tag:'<path d="M20 13 13 20l-9-9V4h7z"/><circle cx="8.5" cy="8.5" r="1"/>',box:'<path d="m21 8-9 5-9-5 9-5z"/><path d="m3 8 9 5 9-5v8l-9 5-9-5z"/>',map:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',flame:'<path d="M12 22c4 0 7-3 7-7 0-3-1.5-5.5-4-8 .2 3-1.3 4.5-2.5 5.5C11 10 9 7 6 5c.5 4-2 6-2 10 0 4 3 7 8 7Z"/>',handshake:'<path d="m8 11 3 3a2 2 0 0 0 3 0l4-4"/><path d="m2 12 5-5 4 1 2-2 4 1 5 5-5 5-3-1-2 2-3-2-2 1z"/>',flag:'<path d="M5 22V4M5 5h10l-1 4 1 4H5"/>',bolt:'<path d="m13 2-8 12h7l-1 8 8-12h-7z"/>',send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',check:'<path d="m5 12 4 4L19 6"/>',admin:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17v-5M12 17V7M16 17v-8"/>',warning:'<path d="M10.3 3.7 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',inbox:'<path d="M4 4h16v16H4z"/><path d="M4 14h4l2 3h4l2-3h4"/>'};
function icon(name,cls=''){return `<svg class="svg-icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.box}</svg>`}
function hydrateIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));root.querySelectorAll('[data-leading-icon]').forEach(el=>{if(!el.querySelector('.svg-icon'))el.insertAdjacentHTML('afterbegin',icon(el.dataset.leadingIcon,'sm'))})}
function categoryIcon(c){const t=((c.slug||'')+' '+(c.name||'')).toLowerCase();if(/car|auto|سيار/.test(t))return 'tag';if(/phone|mobile|موبا|هاتف|الكترون/.test(t))return 'grid';if(/service|خدم/.test(t))return 'spark';if(/home|house|عقار|منزل/.test(t))return 'home';return 'box'}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'حدث خطأ');return b}
function fmtDate(d){if(!d)return'';const x=new Date(d),mins=(Date.now()-x)/60000;if(mins<60)return Math.max(1,Math.floor(mins))+' د';if(mins<1440)return Math.floor(mins/60)+' س';return x.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}
function imgOf(l){return l.image_urls?.[0]||'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=800&q=75'}
function updateAuthUI(){const b=$('#loginBtn');b.innerHTML='';if(me){b.insertAdjacentHTML('beforeend',icon('user','sm')+'<span>@'+esc(me.pi_username||me.display_name||'Pioneer')+'</span>');b.onclick=openProfile}else{b.insertAdjacentHTML('beforeend',icon('user','sm')+'<span>دخول Pi</span>');b.onclick=loginPi}}
function requireLogin(fn){if(!me)return loginPi().then(()=>me&&fn());return fn()}
async function ensurePi(){if(!window.Pi)throw new Error('افتح DealWay داخل Pi Browser لتسجيل الدخول والدفع');if(!piConfig)piConfig=await api('/api/config');if(!piReady){Pi.init({version:'2.0',sandbox:Boolean(piConfig.piSandbox)});piReady=true}return Pi}
async function reconcileIncompletePayment(payment){if(!payment?.identifier)return; if(!token){pendingIncompletePayment=payment;return}try{await api('/api/payments/reconcile',{method:'POST',body:JSON.stringify({paymentId:payment.identifier})});pendingIncompletePayment=null;toast('تمت معالجة دفعة Pi السابقة بنجاح')}catch(e){console.warn('Incomplete Pi payment:',e.message)}}
async function loginPi(){const b=$('#loginBtn');try{b.classList.add('loading');await ensurePi();const a=await Pi.authenticate(['username','payments'],reconcileIncompletePayment);const r=await api('/api/auth/pi',{method:'POST',body:JSON.stringify({accessToken:a.accessToken})});token=r.token;me=r.user;localStorage.setItem('dw_token',token);localStorage.setItem('dw_user',JSON.stringify(me));updateAuthUI();if(pendingIncompletePayment)await reconcileIncompletePayment(pendingIncompletePayment);toast('أهلاً '+(me.display_name||me.pi_username));return r}catch(e){toast(e.message||'تعذر تسجيل الدخول عبر Pi')}finally{b.classList.remove('loading')}}
function logout(){token='';me=null;localStorage.removeItem('dw_token');localStorage.removeItem('dw_user');updateAuthUI();closeModal();toast('تم تسجيل الخروج')}
function toggleSearch(){$('#searchbar').classList.toggle('open');$('#q').focus()}
function goHome(){closeModal();scrollTo({top:0,behavior:'smooth'})}

async function loadCategories(){try{cats=await api('/api/categories');$('#categories').innerHTML=cats.map(c=>`<button class="cat" onclick="pickCategory('${c.id}')"><span class="cat-icon">${icon(categoryIcon(c),'lg')}</span><b>${esc(c.name)}</b></button>`).join('');$('#categoryFilter').innerHTML='<option value="">كل الأقسام</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}catch(e){console.error(e)}}
function pickCategory(id){$('#categoryFilter').value=id;document.getElementById('market').scrollIntoView({behavior:'smooth'});loadListings()}
function resetFilters(){['q','cityFilter','minFilter','maxFilter'].forEach(id=>$('#'+id).value='');$('#categoryFilter').value='';$('#conditionFilter').value='';$('#sortFilter').value='newest';loadListings()}
async function loadListings(){try{$('#listingGrid').innerHTML='<div class="spinner"></div>';const p=new URLSearchParams({q:$('#q').value,category:$('#categoryFilter').value,condition:$('#conditionFilter').value,city:$('#cityFilter').value,min:$('#minFilter').value,max:$('#maxFilter').value,sort:$('#sortFilter').value});const r=await api('/api/listings?'+p);listings=r.data||[];$('#resultText').textContent=(r.count??listings.length)+' إعلان متاح';renderListings()}catch(e){$('#listingGrid').innerHTML=`<div class="empty"><div class="empty-icon">${icon('warning','lg')}</div><b>تعذر تحميل الإعلانات</b>${esc(e.message)}</div>`}}
function renderListings(){if(!listings.length){$('#listingGrid').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">${icon('inbox','lg')}</div><b>لا توجد إعلانات مطابقة</b>جرّب تغيير البحث أو الفلاتر.</div>`;return}$('#listingGrid').innerHTML=listings.map(l=>`<article class="card" tabindex="0" onclick="openListing('${l.id}')" onkeydown="if(event.key==='Enter')openListing('${l.id}')"><div class="thumb" style="background-image:url('${esc(imgOf(l))}')"><div class="badges">${l.featured_until&&new Date(l.featured_until)>new Date()?`<span class="badge featured">${icon('star','sm')} مميز</span>`:''}${l.urgent_until&&new Date(l.urgent_until)>new Date()?`<span class="badge urgent">${icon('flame','sm')} عاجل</span>`:''}</div><button class="heart" aria-label="حفظ في المفضلة" onclick="event.stopPropagation();toggleFavorite('${l.id}',this)">${icon('heart')}</button></div><div class="card-body"><div class="price">${Number(l.price_pi).toLocaleString()} π</div><div class="title">${esc(l.title)}</div><div class="meta"><span>${icon('map','sm')} ${esc([l.area,l.city].filter(Boolean).join('، ')||'غير محدد')}</span><span>${fmtDate(l.created_at)}</span></div></div></article>`).join('')}

function showModal(title,html,small=false){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#sheet').classList.toggle('small',small);$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

async function openListing(id){showModal('تفاصيل الإعلان','<div class="spinner"></div>');try{const {data:l}=await api('/api/listings/'+id);const s=l.profiles||{};showModal(l.title,`<div class="listing-view"><div><div class="gallery-main" style="background-image:url('${esc(imgOf(l))}')"></div><div class="box" style="margin-top:14px"><h3>الوصف</h3><p style="line-height:1.9;color:#4f485a">${esc(l.description)}</p><div class="trustbar"><span class="pill">${l.condition==='new'?'جديد':l.condition==='like_new'?'كالجديد':'مستعمل'}</span>${l.negotiable?'<span class="pill">قابل للتفاوض</span>':''}${l.delivery_available?'<span class="pill">توصيل متاح</span>':''}</div></div></div><div><div class="detail-price">${Number(l.price_pi).toLocaleString()} π</div><div class="sub" style="margin:6px 0 18px;display:flex;gap:12px;flex-wrap:wrap"><span>${icon('map','sm')} ${esc([l.area,l.city,l.country].filter(Boolean).join('، '))}</span><span>${icon('eye','sm')} ${l.views||0}</span></div><div class="sellerbox"><div class="sellerrow"><div class="avatar">${esc((s.display_name||'P')[0])}</div><div><b>${esc(s.display_name||'Pioneer')} ${s.is_verified?icon('check','sm'):''}</b><div class="sub">${icon('star','sm')} ${Number(s.rating||0).toFixed(1)} · ${s.seller_type==='business'?'Business':'فرد'}</div></div></div></div><div style="display:grid;gap:9px;margin-top:13px"><button class="btn primary" onclick="startChat('${l.id}')">${icon('message','sm')} تواصل مع البائع</button><button class="btn outline" onclick="makeOffer('${l.id}',${Number(l.price_pi)})">${icon('handshake','sm')} قدم عرض</button><button class="btn outline" onclick="toggleFavorite('${l.id}')">${icon('heart','sm')} حفظ الإعلان</button><button class="btn outline" onclick="reportListing('${l.id}')">${icon('flag','sm')} إبلاغ</button>${me?.id===l.seller_id?`<button class="btn" onclick="promote('${l.id}')">${icon('bolt','sm')} ترويج الإعلان</button>`:''}</div></div></div>`)}catch(e){$('#modalBody').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

function openSell(){showModal('انشر إعلان جديد',`<form class="formgrid" onsubmit="submitListing(event)"><div><label class="label">العنوان</label><input class="field" name="title" required minlength="3" placeholder="مثال: iPhone 15 Pro 256GB"></div><div><label class="label">القسم</label><select name="category_id" required><option value="">اختر</option>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="full"><label class="label">الوصف</label><textarea name="description" rows="5" required minlength="10" placeholder="اكتب حالة المنتج والمواصفات..."></textarea></div><div><label class="label">السعر بـ Pi</label><input class="field" type="number" step="0.0001" min="0" name="price_pi" required></div><div><label class="label">الحالة</label><select name="condition"><option value="new">جديد</option><option value="like_new">كالجديد</option><option value="used">مستعمل</option></select></div><div><label class="label">الدولة</label><input class="field" name="country" value="Egypt"></div><div><label class="label">المدينة</label><input class="field" name="city" placeholder="Cairo"></div><div><label class="label">المنطقة</label><input class="field" name="area" placeholder="Nasr City"></div><div><label class="label">رابط الصورة الرئيسية</label><input class="field" name="image" type="url" placeholder="https://..."></div><div class="full" style="display:flex;gap:18px"><label><input type="checkbox" name="negotiable"> قابل للتفاوض</label><label><input type="checkbox" name="delivery_available"> التوصيل متاح</label></div><div class="full"><button class="btn primary" style="width:100%">نشر الإعلان مجانًا</button></div></form>`)}
async function submitListing(e){e.preventDefault();const f=new FormData(e.target),b=Object.fromEntries(f);b.price_pi=Number(b.price_pi);b.negotiable=f.has('negotiable');b.delivery_available=f.has('delivery_available');b.image_urls=b.image?[b.image]:[];delete b.image;try{await api('/api/listings',{method:'POST',body:JSON.stringify(b)});closeModal();toast('تم نشر الإعلان');loadListings()}catch(x){toast(x.message)}}

async function toggleFavorite(id,btn){if(!me)return requireLogin(()=>toggleFavorite(id,btn));try{await api('/api/favorites/'+id,{method:'POST'});if(btn){btn.innerHTML=icon('heart');btn.style.color='var(--brand)'};toast('تم الحفظ في المفضلة')}catch(e){toast(e.message)}}
async function openFavorites(){if(!me)return requireLogin(openFavorites);showModal('المفضلة','<div class="spinner"></div>');try{const rows=await api('/api/favorites');const items=rows.map(x=>x.listings).filter(Boolean);$('#modalBody').innerHTML=items.length?`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${items.map(l=>`<div class="card" onclick="openListing('${l.id}')"><div class="thumb" style="background-image:url('${esc(imgOf(l))}')"></div><div class="card-body"><div class="price">${l.price_pi} π</div><b>${esc(l.title)}</b></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">${icon('heart','lg')}</div><b>المفضلة فارغة</b></div>`}catch(e){toast(e.message)}}

async function startChat(listingId){if(!me)return requireLogin(()=>startChat(listingId));try{const r=await api('/api/chats',{method:'POST',body:JSON.stringify({listing_id:listingId})});openChats(r.data.id)}catch(e){toast(e.message)}}
async function openChats(selected){if(!me)return requireLogin(()=>openChats(selected));showModal('الرسائل','<div class="spinner"></div>');try{const rows=await api('/api/chats');const active=selected||rows[0]?.id;$('#modalBody').innerHTML=`<div class="chat-layout"><div class="chat-list">${rows.length?rows.map(c=>`<div class="chat-item" onclick="loadChat('${c.id}')"><b>${esc(c.listings?.title||'محادثة')}</b><div class="sub">${esc((c.messages||[]).at(-1)?.body||'ابدأ المحادثة')}</div></div>`).join(''):'<div class="empty">لا توجد محادثات</div>'}</div><div class="chat-pane" id="chatPane"><div class="empty">اختر محادثة</div></div></div>`;if(active)loadChat(active)}catch(e){toast(e.message)}}
async function loadChat(id){try{const msgs=await api('/api/chats/'+id+'/messages');$('#chatPane').innerHTML=`<div class="messages" id="messages">${msgs.map(m=>`<div class="bubble ${m.sender_id===me.id?'me':''}">${esc(m.body)}</div>`).join('')}</div><form class="chat-compose" onsubmit="sendMessage(event,'${id}')"><input class="field" name="body" autocomplete="off" placeholder="اكتب رسالة..."><button class="btn primary">${icon('send','sm')} إرسال</button></form>`;$('#messages').scrollTop=$('#messages').scrollHeight;if(!socket){socket=io();socket.on('message:new',m=>{if(document.querySelector('#messages')){document.querySelector('#messages').insertAdjacentHTML('beforeend',`<div class="bubble ${m.sender_id===me.id?'me':''}">${esc(m.body)}</div>`);}})}socket.emit('chat:join',id)}catch(e){toast(e.message)}}
async function sendMessage(e,id){e.preventDefault();const body=new FormData(e.target).get('body');if(!body.trim())return;try{await api('/api/chats/'+id+'/messages',{method:'POST',body:JSON.stringify({body})});e.target.reset()}catch(x){toast(x.message)}}

function makeOffer(listingId,price){if(!me)return requireLogin(()=>makeOffer(listingId,price));showModal('قدم عرضك',`<form onsubmit="submitOffer(event,'${listingId}')"><label class="label">السعر الحالي ${price} π</label><input class="field" style="width:100%" name="amount" type="number" step="0.0001" min="0.0001" required placeholder="قيمة عرضك بـ Pi"><button class="btn primary" style="width:100%;margin-top:12px">إرسال العرض</button></form>`,true)}
async function submitOffer(e,id){e.preventDefault();try{await api('/api/offers',{method:'POST',body:JSON.stringify({listing_id:id,amount_pi:Number(new FormData(e.target).get('amount'))})});closeModal();toast('تم إرسال العرض')}catch(x){toast(x.message)}}
function reportListing(id){if(!me)return requireLogin(()=>reportListing(id));showModal('الإبلاغ عن إعلان',`<form onsubmit="submitReport(event,'${id}')"><select name="reason" style="width:100%"><option>Scam</option><option>Fake Product</option><option>Illegal Product</option><option>Spam</option><option>Misleading Price</option><option>Other</option></select><textarea name="details" rows="4" style="width:100%;margin-top:10px" placeholder="تفاصيل إضافية"></textarea><button class="btn danger" style="width:100%;margin-top:10px">إرسال البلاغ</button></form>`,true)}
async function submitReport(e,id){e.preventDefault();const f=new FormData(e.target);try{await api('/api/reports',{method:'POST',body:JSON.stringify({listing_id:id,reason:f.get('reason'),details:f.get('details')})});closeModal();toast('تم استلام البلاغ')}catch(x){toast(x.message)}}

async function promote(id){try{const s=await api('/api/settings'),p=s.promotion_prices||{};showModal('ترويج الإعلان',`<div style="display:grid;gap:10px">${[['boost_1d','Boost 24 ساعة',p.boost_1d||1],['boost_3d','Boost 3 أيام',p.boost_3d||2],['featured_7d','Featured 7 أيام',p.featured_7d||10],['urgent','Urgent Badge',p.urgent||2]].map(x=>`<button class="box" style="text-align:right" onclick="payPromotion('${id}','${x[0]}',${x[2]})"><b>${x[1]}</b><div class="price" style="font-size:20px">${x[2]} π</div></button>`).join('')}</div>`,true)}catch(e){toast(e.message)}}
async function payPromotion(listingId,service,amount){try{if(!me)await loginPi();if(!me)return;await ensurePi();await Pi.createPayment({amount,memo:`DealWay ${service}`,metadata:{listingId,service}}, {onReadyForServerApproval:async paymentId=>api('/api/payments/approve',{method:'POST',body:JSON.stringify({paymentId})}),onReadyForServerCompletion:async(paymentId,txid)=>{await api('/api/payments/complete',{method:'POST',body:JSON.stringify({paymentId,txid})});closeModal();toast('تم تفعيل الترويج');loadListings()},onCancel:()=>toast('تم إلغاء الدفع'),onError:(e,payment)=>{if(payment)reconcileIncompletePayment(payment);toast(e.message||'فشل الدفع')}})}catch(e){toast(e.message||'تعذر بدء الدفع')}}

async function openProfile(){if(!me)return requireLogin(openProfile);showModal('حسابي',`<div class="sellerbox"><div class="sellerrow"><div class="avatar" style="width:62px;height:62px">${esc((me.display_name||'P')[0])}</div><div><h2 style="margin:0">${esc(me.display_name||me.pi_username)}</h2><div class="sub">@${esc(me.pi_username||'pioneer')} · ${me.seller_type==='business'?'Business':'Individual'}</div></div></div><div class="trustbar"><span class="pill">${icon('star','sm')} ${Number(me.rating||0).toFixed(1)}</span><span class="pill">${icon('check','sm')} Pi User</span><span class="pill">${me.completed_deals||0} صفقة</span></div></div><div style="display:grid;gap:9px;margin-top:14px"><button class="btn outline" onclick="openMyListings()">${icon('box','sm')} إعلاناتي</button>${['admin','super_admin','moderator'].includes(me.role)?`<button class="btn outline" onclick="openAdmin()">${icon('admin','sm')} لوحة الإدارة</button>`:''}<button class="btn danger" onclick="logout()">تسجيل الخروج</button></div>`)}
async function openMyListings(){showModal('إعلاناتي','<div class="spinner"></div>');try{const a=await api('/api/my-listings');$('#modalBody').innerHTML=a.length?a.map(l=>`<div class="box" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><b>${esc(l.title)}</b><div class="sub">${l.price_pi} π · ${l.status}</div></div><button class="btn outline" onclick="promote('${l.id}')">ترويج</button></div>`).join(''):'<div class="empty">لا توجد إعلانات</div>'}catch(e){toast(e.message)}}
async function openAdmin(){showModal('لوحة الإدارة','<div class="spinner"></div>');try{const s=await api('/api/admin/stats');$('#modalBody').innerHTML=`<div class="admincards"><div class="stat">المستخدمون<b>${s.users}</b></div><div class="stat">الإعلانات<b>${s.listings}</b></div><div class="stat">بلاغات مفتوحة<b>${s.openReports}</b></div><div class="stat">إيراد Pi<b>${s.revenuePi} π</b></div></div><div class="box" style="margin-top:16px">تم تجميع لوحة الإدارة في نفس الواجهة للحفاظ على شرط الملف الواحد.</div>`}catch(e){toast(e.message)}}

(async function boot(){hydrateIcons();updateAuthUI();if(token){try{const r=await api('/api/me');me=r.user;localStorage.setItem('dw_user',JSON.stringify(me));updateAuthUI()}catch{logout()}}await loadCategories();await loadListings()})();
